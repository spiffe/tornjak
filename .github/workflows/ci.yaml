name: Tornjak CI
on: [push, pull_request]
jobs:
  tornjak-build:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger info
        run: |
          cat <<EOF >>"${GITHUB_STEP_SUMMARY}"
          # Workflow job info

          - 🎉 The job was automatically triggered by a ${{ github.event_name }} event.
          - 🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!
          - 🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}.
          EOF

      - name: Check out repository code
        uses: actions/checkout@v6.0.2

      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: actions/setup-node@v6.2.0
        with:
          node-version: '18'

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download modules
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.1.6
          args: --timeout 7m

      - name: Go unit tests
        run: make test-go

      # Verifies frontend/package-lock.json is in sync with package.json.
      # The frontend image build uses `npm install`, which silently rewrites a
      # desynced lockfile instead of failing; `npm ci` errors out instead.
      # Kept as its own step so lockfile drift fails distinctly from a test
      # failure, even though make test-frontend also runs npm ci.
      - name: Verify frontend lockfile and install
        run: npm ci --prefix frontend

      - name: Frontend unit tests
        run: make test-frontend

      - name: Build binaries
        run: make binaries

      - name: Build images
        run: make images

      # `make images` only proves the image builds. This starts the frontend
      # container and checks it actually serves the app and its injected env.js.
      - name: Frontend image smoke test
        run: make smoke-test-frontend

      - name: Print job result
        run: |
          cat <<EOF >>"${GITHUB_STEP_SUMMARY}"
          - 🍏 This job's status is ${{ job.status }}.
          EOF
